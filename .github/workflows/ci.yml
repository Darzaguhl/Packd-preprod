name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit tests (every push) ───────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: packd
          POSTGRES_PASSWORD: packd
          POSTGRES_DB: packd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://packd:packd@localhost:5432/packd_test
      NODE_ENV: test
      # Third-party SDKs are stubbed in unit tests — real keys not needed
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: re_placeholder
      ICAL_SECRET: ci-test-secret
      WEB_URL: http://localhost:3000
      PORT: 4000
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run unit tests
        run: npm test -- --reporter=verbose

  # ── TypeScript (every push) ───────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type-check API
        run: cd apps/api && npx tsc --noEmit

      - name: Type-check Web
        run: cd apps/web && npx tsc --noEmit

  # ── E2E tests (PRs only — hits real Supabase, slower) ─────────────────────────
  #
  # Required GitHub secrets (Settings → Secrets → Actions):
  #   SUPABASE_URL              e.g. https://xxxx.supabase.co
  #   SUPABASE_ANON_KEY         publishable key (sb_publishable_...)
  #   SUPABASE_SERVICE_ROLE_KEY service role key (never expose client-side)
  #   DATABASE_URL              postgres://... (Supabase direct connection string)
  #   STUDIO_ID                 cuid of the seeded Packd Demo studio
  #
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    env:
      CI: true
      BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: 4000
      ICAL_SECRET: ci-e2e-secret
      # Stripe + Resend can be placeholders — E2E tests don't trigger payments
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: re_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Write env files from secrets so both servers can start
      - name: Create API env file
        run: |
          cat > apps/api/.env << 'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CORS_ORIGIN=http://localhost:3000
          WEB_URL=http://localhost:3000
          PORT=4000
          STRIPE_SECRET_KEY=sk_test_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_placeholder
          RESEND_API_KEY=re_placeholder
          ICAL_SECRET=ci-e2e-secret
          EOF

      - name: Create web env file
        run: |
          cat > apps/web/.env.local << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL=http://localhost:4000
          NEXT_PUBLIC_STUDIO_ID=${{ secrets.STUDIO_ID }}
          EOF

      - name: Run E2E tests
        env:
          # Make secrets available to global-setup.ts (dotenv reads these files,
          # but explicit env vars take precedence for the Playwright process itself)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_STUDIO_ID: ${{ secrets.STUDIO_ID }}
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
